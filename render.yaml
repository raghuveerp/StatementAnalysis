services:
  - name: statement-analysis-api
    type: web
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://statement-analysis-web.onrender.com

  - name: statement-analysis-web
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://statement-analysis-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
